name: Python checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check Python syntax
        run: python -m compileall -q custom_components/suez_enhanced
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components/suez_enhanced").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          PY
